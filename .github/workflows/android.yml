name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "Backend URL ending in /api/v1/ (e.g. https://swasthbal4d-api.onrender.com/api/v1/)"
        required: false

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build debug APK
        env:
          API_URL: ${{ github.event.inputs.api_base_url || vars.API_BASE_URL }}
        run: |
          if [ -n "$API_URL" ]; then gradle assembleDebug -PapiBaseUrl="$API_URL"; else gradle assembleDebug; fi
      - uses: actions/upload-artifact@v4
        with:
          name: swasthbal4d-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
